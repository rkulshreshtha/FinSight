name: FinSight
options:
  bundleIdPrefix: com.rkulshreshtha
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: "11.0.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    from: "7.1.0"
  GenerativeAI:
    url: https://github.com/google/generative-ai-swift.git
    from: "0.5.1"
  GoogleAPIClientForREST:
    url: https://github.com/google/google-api-objectivec-client-for-rest.git
    from: "3.0.0"

targets:
  FinSight:
    type: application
    platform: iOS
    sources:
      - path: FinSight
    settings:
      base:
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        INFOPLIST_KEY_NSCameraUsageDescription: "We need camera access to scan receipts and bills."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "We need photo library access to attach receipt images."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "We need location access to tag transactions with places."
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseRemoteConfig
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GenerativeAI
        product: GoogleGenerativeAI
      - package: GoogleAPIClientForREST
        product: GoogleAPIClientForREST_Drive

  FinSightShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: FinSightShareExtension
    settings:
      base:
        SWIFT_VERSION: "6.0"
    info:
      path: FinSightShareExtension/Info.plist
    dependencies:
      - target: FinSight

  FinSightTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FinSightTests
    dependencies:
      - target: FinSight
